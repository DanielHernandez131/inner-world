name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --project apps/api --locked
      - name: Verify generated contracts
        run: |
          npm run contracts:generate
          git diff --exit-code -- contracts apps/web/src/shared/contracts/generated.ts
      - name: Validate frontend and backend
        run: npm run check
