[project]
name = "inner-world-api"
version = "0.1.0"
description = "API para la exploración emocional de Inner World"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
 "httpx2>=2.13.1",
 "pytest>=8.3,<10.0",
 "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inner_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
